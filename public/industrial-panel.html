<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الصناعي - Aleppo Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .main-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eef2f5;
            padding-bottom: 10px;
        }
        .main-tabs .tab-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: #4a5a6a;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .main-tabs .tab-btn:hover { background: rgba(0,0,0,0.03); }
        .main-tabs .tab-btn.active { background: #c9a03d; color: #fff; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .product-card img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 12px;
            object-fit: cover;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-grid { margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🏭</span>
                <span class="logo-text">Aleppo <span class="gold">Hub</span></span>
            </div>
            <div class="nav-links">
                <a href="/" class="active">السوق</a>
                <a href="#" onclick="logout()" style="color:#c0392b;">تسجيل الخروج</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar-modern">
            <div class="user-profile">
                <div class="avatar">🏭</div>
                <h3 id="userName">صناعي</h3>
                <p id="userEmail">industrial@example.com</p>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" data-section="products">📦 منتجاتي</a>
                <a href="#" class="menu-item" data-section="jobs">💼 وظائفي</a>
                <a href="#" class="menu-item" data-section="applications">📩 طلبات التوظيف</a>
                <a href="#" class="menu-item" data-section="add-product">➕ إضافة منتج</a>
                <a href="#" class="menu-item" data-section="add-job">➕ نشر وظيفة</a>
            </nav>
        </aside>

        <main class="content-modern">
            <div class="main-tabs">
                <button class="tab-btn active" data-tab="products">📦 المنتجات</button>
                <button class="tab-btn" data-tab="services">🛠️ الخدمات</button>
                <button class="tab-btn" data-tab="ads">💰 الإعلانات</button>
                <button class="tab-btn" data-tab="jobs">💼 الوظائف</button>
            </div>

            <div id="marketContent">
                <div id="productsTab" class="tab-content active"><div class="product-grid" id="productsGrid">جاري التحميل...</div></div>
                <div id="servicesTab" class="tab-content"><div class="product-grid" id="servicesGrid">جاري التحميل...</div></div>
                <div id="adsTab" class="tab-content"><div class="product-grid" id="adsGrid">جاري التحميل...</div></div>
                <div id="jobsTab" class="tab-content"><div class="product-grid" id="jobsGrid">جاري التحميل...</div></div>
            </div>

            <div id="dashboardContent" style="display:none;">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><span id="statProducts">0</span><small>منتجاتي</small></div>
                    <div class="stat-card"><span id="statJobs">0</span><small>وظائفي</small></div>
                    <div class="stat-card"><span id="statApplications">0</span><small>طلبات واردة</small></div>
                </div>
                <div id="sectionContent"></div>
            </div>
        </main>
    </div>

    <script>
        async function loadUserInfo() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('userName').textContent = user.name || 'صناعي';
                    document.getElementById('userEmail').textContent = user.email || 'industrial@example.com';
                }
            } catch(e) { console.error('خطأ في جلب معلومات المستخدم', e); }
        }

        document.querySelectorAll('.main-tabs .tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.main-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('#marketContent .tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById(tab + 'Tab').classList.add('active');
                loadMarketData(tab);
            });
        });

        async function loadMarketData(type) {
            const map = { products: 'products', services: 'services', ads: 'external-ads', jobs: 'jobs' };
            const gridId = type + 'Grid';
            const grid = document.getElementById(gridId);
            grid.innerHTML = 'جاري التحميل...';
            try {
                const res = await fetch(`/api/${map[type]}`);
                const data = await res.json();
                if (!data || data.length === 0) {
                    grid.innerHTML = '<p style="text-align:center;color:#b8a06a;">📭 لا توجد عناصر معتمدة حالياً</p>';
                    return;
                }
                let html = '';
                data.forEach(item => {
                    let imageHtml = '';
                    if (item.file_url && item.file_url.startsWith('/uploads')) {
                        imageHtml = `<img src="${item.file_url}" alt="${item.name || item.title}" onerror="this.style.display='none'">`;
                    }
                    const name = item.name || item.title;
                    const desc = item.description || '';
                    const price = item.price ? `${item.price} $` : (item.salary || item.price_range || 'حسب الاتفاق');
                    html += `<div class="product-card">
                        ${imageHtml}
                        <h3>${name}</h3>
                        <p>${desc}</p>
                        <p class="price">${price}</p>
                        <p style="font-size:0.8rem; color:#8a9aaa;">الناشر: ${item.industrial_id?.company_name || item.industrial_id?.name || item.provider_id?.name || 'غير معروف'}</p>
                    </div>`;
                });
                grid.innerHTML = html;
            } catch(e) {
                grid.innerHTML = '<p style="color:red;">❌ خطأ في التحميل</p>';
            }
        }

        async function loadIndustrialStats() {
            try {
                const resProducts = await fetch('/api/my-products');
                if (resProducts.ok) {
                    const products = await resProducts.json();
                    document.getElementById('statProducts').textContent = products.length || 0;
                }
            } catch(e) { console.error('خطأ في إحصائيات المنتجات', e); }

            try {
                const resJobs = await fetch('/api/my-jobs');
                if (resJobs.ok) {
                    const jobs = await resJobs.json();
                    document.getElementById('statJobs').textContent = jobs.length || 0;
                }
            } catch(e) { console.error('خطأ في إحصائيات الوظائف', e); }

            try {
                const resApps = await fetch('/api/industrial/applications');
                if (resApps.ok) {
                    const apps = await resApps.json();
                    document.getElementById('statApplications').textContent = apps.length || 0;
                }
            } catch(e) { console.error('خطأ في إحصائيات الطلبات', e); }
        }

        async function loadProducts() {
            const content = document.getElementById('sectionContent');
            content.innerHTML = '<h2>📦 منتجاتي</h2><div class="card"><p>جاري التحميل...</p></div>';
            try {
                const res = await fetch('/api/my-products');
                const data = await res.json();
                if (!data || data.length === 0) {
                    content.innerHTML = '<h2>📦 منتجاتي</h2><div class="card"><p>📭 لم تقم بإضافة أي منتج بعد.</p></div>';
                    return;
                }
                let html = '<h2>📦 منتجاتي</h2>';
                data.forEach(p => {
                    const statusText = p.is_approved ? (p.is_active ? '✅ منشور' : '⏳ قيد المراجعة') : '⏳ قيد المراجعة';
                    const statusColor = p.is_approved && p.is_active ? '#27ae60' : '#f39c12';
                    const fileHtml = p.file_url ? (p.file_type === 'video' ? `<video controls style="max-width:200px;max-height:120px;border-radius:8px;margin:5px 0;"><source src="${p.file_url}"></video>` : `<img src="${p.file_url}" style="max-width:200px;max-height:120px;border-radius:8px;margin:5px 0;">`) : '';
                    html += `<div class="card">
                        <h3>${p.name}</h3>
                        <p>${p.description || ''}</p>
                        <p><strong>السعر:</strong> ${p.price || 'سعر متغير'} $</p>
                        ${fileHtml}
                        <p><span style="color:${statusColor};">${statusText}</span></p>
                    </div>`;
                });
                content.innerHTML = html;
            } catch(e) {
                content.innerHTML = '<h2>📦 منتجاتي</h2><div class="card"><p style="color:red;">❌ خطأ في التحميل</p></div>';
            }
        }

        async function loadJobs() {
            const content = document.getElementById('sectionContent');
            content.innerHTML = '<h2>💼 وظائفي</h2><div class="card"><p>جاري التحميل...</p></div>';
            try {
                const res = await fetch('/api/my-jobs');
                const data = await res.json();
                if (!data || data.length === 0) {
                    content.innerHTML = '<h2>💼 وظائفي</h2><div class="card"><p>📭 لم تنشر أي وظيفة بعد.</p></div>';
                    return;
                }
                let html = '<h2>💼 وظائفي</h2>';
                data.forEach(j => {
                    const statusText = j.is_approved ? (j.is_active ? '✅ منشورة' : '⏳ قيد المراجعة') : '⏳ قيد المراجعة';
                    const statusColor = j.is_approved && j.is_active ? '#27ae60' : '#f39c12';
                    const fileHtml = j.file_url ? (j.file_type === 'video' ? `<video controls style="max-width:200px;max-height:120px;border-radius:8px;margin:5px 0;"><source src="${j.file_url}"></video>` : `<img src="${j.file_url}" style="max-width:200px;max-height:120px;border-radius:8px;margin:5px 0;">`) : '';
                    html += `<div class="card">
                        <h3>${j.title}</h3>
                        <p>${j.description}</p>
                        <p><strong>الراتب:</strong> ${j.salary || 'حسب الاتفاق'}</p>
                        ${fileHtml}
                        <p><span style="color:${statusColor};">${statusText}</span></p>
                    </div>`;
                });
                content.innerHTML = html;
            } catch(e) {
                content.innerHTML = '<h2>💼 وظائفي</h2><div class="card"><p style="color:red;">❌ خطأ في التحميل</p></div>';
            }
        }

        async function loadApplications() {
            const content = document.getElementById('sectionContent');
            content.innerHTML = '<h2>📩 طلبات التوظيف</h2><div class="card"><p>جاري التحميل...</p></div>';
            try {
                const res = await fetch('/api/industrial/applications');
                const data = await res.json();
                if (!data || data.length === 0) {
                    content.innerHTML = '<h2>📩 طلبات التوظيف</h2><div class="card"><p>📭 لا توجد طلبات على وظائفك حتى الآن.</p></div>';
                    return;
                }
                let html = '<h2>📩 طلبات التوظيف الواردة</h2>';
                data.forEach(a => {
                    const statusMap = { pending: '⏳ قيد الانتظار', accepted: '✅ مقبول', rejected: '❌ مرفوض' };
                    const fileHtml = a.file_url ? (a.file_type === 'pdf' ? `<a href="${a.file_url}" target="_blank" class="btn btn-sm">📄 عرض السيرة الذاتية (PDF)</a>` : a.file_type === 'video' ? `<video controls style="max-width:200px;max-height:120px;border-radius:8px;margin:5px 0;"><source src="${a.file_url}"></video>` : `<img src="${a.file_url}" style="max-width:200px;max-height:120px;border-radius:8px;margin:5px 0;">`) : '';
                    html += `<div class="card">
                        <h3>${a.job_id?.title || 'وظيفة غير محددة'}</h3>
                        <p><strong>المتقدم:</strong> ${a.worker_id?.name || 'مستخدم'}</p>
                        <p><strong>الهاتف:</strong> ${a.worker_id?.phone || 'غير متوفر'}</p>
                        <p><strong>الرسالة:</strong> ${a.message || 'لا توجد'}</p>
                        ${fileHtml}
                        <p><strong>الحالة:</strong> ${statusMap[a.status] || a.status}</p>
                        ${a.status === 'pending' ? `
                            <div style="margin-top:10px;display:flex;gap:10px;">
                                <button class="btn btn-sm btn-success" onclick="updateAppStatus('${a._id}','accepted')">✅ قبول</button>
                                <button class="btn btn-sm btn-danger" onclick="updateAppStatus('${a._id}','rejected')">❌ رفض</button>
                            </div>
                        ` : ''}
                    </div>`;
                });
                content.innerHTML = html;
            } catch(e) {
                content.innerHTML = '<h2>📩 طلبات التوظيف</h2><div class="card"><p style="color:red;">❌ خطأ في التحميل</p></div>';
            }
        }

        async function updateAppStatus(appId, status) {
            if (!confirm(`تأكيد ${status === 'accepted' ? 'قبول' : 'رفض'} هذا الطلب؟`)) return;
            try {
                const res = await fetch(`/api/application/${appId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const result = await res.json();
                alert(result.message || (result.error ? '❌ ' + result.error : 'تم التحديث'));
                if (res.ok) loadApplications();
            } catch(e) {
                alert('فشل التحديث');
                console.error(e);
            }
        }

        function showAddProduct() {
            const content = document.getElementById('sectionContent');
            content.innerHTML = `
                <h2>➕ إضافة منتج جديد</h2>
                <div class="card">
                    <form id="productForm" enctype="multipart/form-data">
                        <div class="form-group"><label>اسم المنتج</label><input type="text" id="prodName" required></div>
                        <div class="form-group"><label>الوصف</label><textarea id="prodDesc" rows="2"></textarea></div>
                        <div class="form-group"><label>السعر ($)</label><input type="number" id="prodPrice"></div>
                        <div class="form-group"><label>رفع ملف (صورة أو فيديو)</label><input type="file" id="prodFile" accept="image/*,video/*"></div>
                        <button type="submit">نشر المنتج</button>
                    </form>
                </div>
            `;
            document.getElementById('productForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData();
                formData.append('name', document.getElementById('prodName').value);
                formData.append('description', document.getElementById('prodDesc').value);
                formData.append('price', document.getElementById('prodPrice').value);
                const file = document.getElementById('prodFile').files[0];
                if (file) formData.append('file', file);
                try {
                    const res = await fetch('/api/products', { method: 'POST', body: formData });
                    const result = await res.json();
                    alert(result.message || (result.error ? '❌ ' + result.error : 'تم النشر'));
                    if (res.ok) {
                        document.getElementById('productForm').reset();
                        loadIndustrialStats();
                    }
                } catch(e) {
                    alert('فشل النشر');
                    console.error(e);
                }
            });
        }

        function showAddJob() {
            const content = document.getElementById('sectionContent');
            content.innerHTML = `
                <h2>➕ نشر وظيفة جديدة</h2>
                <div class="card">
                    <form id="jobForm" enctype="multipart/form-data">
                        <div class="form-group"><label>عنوان الوظيفة</label><input type="text" id="jobTitle" required></div>
                        <div class="form-group"><label>الوصف</label><textarea id="jobDesc" rows="2" required></textarea></div>
                        <div class="form-group"><label>المتطلبات</label><textarea id="jobReq" rows="2"></textarea></div>
                        <div class="form-group"><label>الراتب</label><input type="text" id="jobSalary" placeholder="مثلاً: 500-700$"></div>
                        <div class="form-group"><label>نوع العامل المطلوب</label><input type="text" id="jobWorkerType" placeholder="لحام، كهربائي، سائق..."></div>
                        <div class="form-group"><label>رفع ملف (صورة أو فيديو)</label><input type="file" id="jobFile" accept="image/*,video/*"></div>
                        <button type="submit">نشر الوظيفة</button>
                    </form>
                </div>
            `;
            document.getElementById('jobForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData();
                formData.append('title', document.getElementById('jobTitle').value);
                formData.append('description', document.getElementById('jobDesc').value);
                formData.append('requirements', document.getElementById('jobReq').value);
                formData.append('salary', document.getElementById('jobSalary').value);
                formData.append('worker_type', document.getElementById('jobWorkerType').value);
                const file = document.getElementById('jobFile').files[0];
                if (file) formData.append('file', file);
                try {
                    const res = await fetch('/api/jobs', { method: 'POST', body: formData });
                    const result = await res.json();
                    alert(result.message || (result.error ? '❌ ' + result.error : 'تم النشر'));
                    if (res.ok) {
                        document.getElementById('jobForm').reset();
                        loadIndustrialStats();
                    }
                } catch(e) {
                    alert('فشل النشر');
                    console.error(e);
                }
            });
        }

        document.querySelectorAll('.sidebar-menu .menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-menu .menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                const section = this.dataset.section;
                document.getElementById('marketContent').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                document.getElementById('statsGrid').style.display = 'grid';

                if (section === 'products') loadProducts();
                else if (section === 'jobs') loadJobs();
                else if (section === 'applications') loadApplications();
                else if (section === 'add-product') showAddProduct();
                else if (section === 'add-job') showAddJob();
            });
        });

        document.getElementById('dashboardContent').style.display = 'none';
        loadMarketData('products');

        function logout() {
            if (confirm('تسجيل الخروج؟')) {
                fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/');
            }
        }

        loadUserInfo();
        loadIndustrialStats();
    </script>
</body>
</html>
