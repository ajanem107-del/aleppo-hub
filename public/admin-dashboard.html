<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأدمن - Aleppo Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .main-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eef2f5;
            padding-bottom: 10px;
        }
        .main-tabs .tab-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: #4a5a6a;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .main-tabs .tab-btn:hover { background: rgba(0,0,0,0.03); }
        .main-tabs .tab-btn.active { background: #c9a03d; color: #fff; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .product-card img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 12px;
            object-fit: cover;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .request-card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-right: 4px solid #c9a03d; }
        .request-card .actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .badge-pending { background: #f39c12; color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; }
        .file-preview { max-width: 150px; max-height: 100px; border-radius: 8px; margin: 5px 0; }
        .payment-section { background: #f0f7f0; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .payment-code { font-size: 1.2rem; font-weight: bold; color: #27ae60; }
        .section-title { margin-top: 20px; padding: 10px; background: #f8fafc; border-radius: 12px; }
        .empty-message { color: #6a7a8a; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><span class="logo-icon">👑</span><span class="logo-text">Aleppo <span class="gold">Hub</span></span></div>
            <div class="nav-links">
                <a href="/" class="active">السوق</a>
                <a href="#" onclick="logout()" style="color:#c0392b;">تسجيل الخروج</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar-modern">
            <div class="user-profile">
                <div class="avatar">👑</div>
                <h3 id="adminName">المدير العام</h3>
                <p id="adminEmail">admin@aleppo.com</p>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" data-section="pending">📋 الطلبات المعلقة</a>
                <a href="#" class="menu-item" data-section="confirm-payment">💰 تأكيد الدفع</a>
            </nav>
        </aside>

        <main class="content-modern">
            <div class="main-tabs">
                <button class="tab-btn active" data-tab="products">📦 المنتجات</button>
                <button class="tab-btn" data-tab="services">🛠️ الخدمات</button>
                <button class="tab-btn" data-tab="ads">💰 الإعلانات</button>
                <button class="tab-btn" data-tab="jobs">💼 الوظائف</button>
            </div>

            <div id="marketContent">
                <div id="productsTab" class="tab-content active"><div class="product-grid" id="productsGrid">جاري التحميل...</div></div>
                <div id="servicesTab" class="tab-content"><div class="product-grid" id="servicesGrid">جاري التحميل...</div></div>
                <div id="adsTab" class="tab-content"><div class="product-grid" id="adsGrid">جاري التحميل...</div></div>
                <div id="jobsTab" class="tab-content"><div class="product-grid" id="jobsGrid">جاري التحميل...</div></div>
            </div>

            <div id="dashboardContent" style="display:none;">
                <div id="sectionContent"></div>
            </div>
        </main>
    </div>

    <script>
        async function loadUser() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) { window.location.href = '/login.html'; return; }
                const user = await res.json();
                document.getElementById('adminName').textContent = user.name;
                document.getElementById('adminEmail').textContent = user.email;
            } catch(e) { console.error(e); }
        }

        document.querySelectorAll('.main-tabs .tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.main-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('#marketContent .tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById(tab + 'Tab').classList.add('active');
                loadMarketData(tab);
            });
        });

        async function loadMarketData(type) {
            const map = { products: 'products', services: 'services', ads: 'external-ads', jobs: 'jobs' };
            const gridId = type + 'Grid';
            const grid = document.getElementById(gridId);
            grid.innerHTML = 'جاري التحميل...';
            try {
                const res = await fetch(`/api/${map[type]}`);
                const data = await res.json();
                if (!data || data.length === 0) {
                    grid.innerHTML = '<p style="text-align:center;color:#b8a06a;">📭 لا توجد عناصر معتمدة حالياً</p>';
                    return;
                }
                let html = '';
                data.forEach(item => {
                    let imageHtml = '';
                    if (item.file_url && item.file_url.startsWith('/uploads')) {
                        imageHtml = `<img src="${item.file_url}" alt="${item.name || item.title}" onerror="this.style.display='none'">`;
                    }
                    const name = item.name || item.title;
                    const desc = item.description || '';
                    const price = item.price ? `${item.price} $` : (item.salary || item.price_range || 'حسب الاتفاق');
                    html += `<div class="product-card">
                        ${imageHtml}
                        <h3>${name}</h3>
                        <p>${desc}</p>
                        <p class="price">${price}</p>
                        <p style="font-size:0.8rem; color:#8a9aaa;">الناشر: ${item.industrial_id?.company_name || item.industrial_id?.name || item.provider_id?.name || 'غير معروف'}</p>
                    </div>`;
                });
                grid.innerHTML = html;
            } catch(e) {
                grid.innerHTML = '<p style="color:red;">❌ خطأ في التحميل</p>';
            }
        }

        async function loadPendingRequests() {
            const content = document.getElementById('sectionContent');
            content.innerHTML = '<p>⏳ جاري التحميل...</p>';
            try {
                const res = await fetch('/api/admin/pending-requests');
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'فشل التحميل');
                }
                const data = await res.json();

                let html = '<h2>📋 الطلبات المعلقة</h2>';

                if (data.products && data.products.length > 0) {
                    html += `<div class="section-title"><h3>📦 منتجات (${data.products.length})</h3></div>`;
                    data.products.forEach(p => {
                        const fileHtml = p.file_url ? (p.file_type === 'video' ? `<video controls class="file-preview"><source src="${p.file_url}"></video>` : `<img src="${p.file_url}" class="file-preview">`) : '';
                        html += `<div class="request-card">
                            <strong>${p.name}</strong> - ${p.price || 'سعر متغير'} $<br>${fileHtml}<br>
                            الناشر: ${p.industrial_id?.company_name || p.industrial_id?.name || 'غير معروف'}<br>
                            <span class="badge-pending">⏳ قيد المراجعة</span>
                            <div class="actions">
                                <button class="btn btn-sm btn-success" onclick="approveRequest('product','${p._id}')">✅ موافقة</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectRequest('product','${p._id}')">❌ رفض</button>
                            </div>
                        </div>`;
                    });
                }

                if (data.jobs && data.jobs.length > 0) {
                    html += `<div class="section-title"><h3>💼 وظائف (${data.jobs.length})</h3></div>`;
                    data.jobs.forEach(j => {
                        const fileHtml = j.file_url ? (j.file_type === 'video' ? `<video controls class="file-preview"><source src="${j.file_url}"></video>` : `<img src="${j.file_url}" class="file-preview">`) : '';
                        html += `<div class="request-card">
                            <strong>${j.title}</strong> - ${j.salary || 'حسب الاتفاق'}<br>${fileHtml}<br>
                            الناشر: ${j.industrial_id?.company_name || j.industrial_id?.name || 'غير معروف'}<br>
                            <span class="badge-pending">⏳ قيد المراجعة</span>
                            <div class="actions">
                                <button class="btn btn-sm btn-success" onclick="approveRequest('job','${j._id}')">✅ موافقة</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectRequest('job','${j._id}')">❌ رفض</button>
                            </div>
                        </div>`;
                    });
                }

                if (data.services && data.services.length > 0) {
                    html += `<div class="section-title"><h3>🛠️ خدمات (${data.services.length})</h3></div>`;
                    data.services.forEach(s => {
                        const fileHtml = s.file_url ? (s.file_type === 'video' ? `<video controls class="file-preview"><source src="${s.file_url}"></video>` : `<img src="${s.file_url}" class="file-preview">`) : '';
                        html += `<div class="request-card">
                            <strong>${s.title}</strong> - ${s.category}<br>${fileHtml}<br>
                            المقدم: ${s.provider_id?.name || 'غير معروف'}<br>
                            <span class="badge-pending">⏳ قيد المراجعة</span>
                            <div class="actions">
                                <button class="btn btn-sm btn-success" onclick="approveRequest('service','${s._id}')">✅ موافقة</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectRequest('service','${s._id}')">❌ رفض</button>
                            </div>
                        </div>`;
                    });
                }

                if (data.applications && data.applications.length > 0) {
                    html += `<div class="section-title"><h3>📩 طلبات توظيف (${data.applications.length})</h3></div>`;
                    data.applications.forEach(a => {
                        const fileHtml = a.file_url ? (a.file_type === 'pdf' ? `<a href="${a.file_url}" target="_blank" class="btn btn-sm">📄 عرض السيرة الذاتية (PDF)</a>` : a.file_type === 'video' ? `<video controls class="file-preview"><source src="${a.file_url}"></video>` : `<img src="${a.file_url}" class="file-preview">`) : '';
                        html += `<div class="request-card">
                            <strong>${a.job_id?.title || 'وظيفة'}</strong> - مقدم من: ${a.worker_id?.name || 'مستخدم'}<br>${fileHtml}<br>
                            الرسالة: ${a.message || 'لا توجد'}<br>
                            <span class="badge-pending">⏳ قيد المراجعة</span>
                            <div class="actions">
                                <button class="btn btn-sm btn-success" onclick="approveRequest('application','${a._id}')">✅ موافقة</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectRequest('application','${a._id}')">❌ رفض</button>
                            </div>
                        </div>`;
                    });
                }

                if (data.serviceRequests && data.serviceRequests.length > 0) {
                    html += `<div class="section-title"><h3>📩 طلبات خدمات (${data.serviceRequests.length})</h3></div>`;
                    data.serviceRequests.forEach(r => {
                        const fileHtml = r.file_url ? (r.file_type === 'video' ? `<video controls class="file-preview"><source src="${r.file_url}"></video>` : `<img src="${r.file_url}" class="file-preview">`) : '';
                        html += `<div class="request-card">
                            <strong>طلب على: ${r.service_id?.title || 'خدمة'}</strong><br>${fileHtml}<br>
                            من: ${r.requester_id?.name || 'مستخدم'}<br>
                            الرسالة: ${r.message || 'لا توجد'}<br>
                            <span class="badge-pending">⏳ قيد المراجعة</span>
                            <div class="actions">
                                <button class="btn btn-sm btn-success" onclick="approveRequest('serviceRequest','${r._id}')">✅ موافقة</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectRequest('serviceRequest','${r._id}')">❌ رفض</button>
                            </div>
                        </div>`;
                    });
                }

                if (data.ads && data.ads.length > 0) {
                    html += `<div class="section-title"><h3>💰 إعلانات ممولة (${data.ads.length})</h3></div>`;
                    data.ads.forEach(a => {
                        const fileHtml = a.file_url ? (a.file_type === 'video' ? `<video controls class="file-preview"><source src="${a.file_url}"></video>` : `<img src="${a.file_url}" class="file-preview">`) : '';
                        html += `<div class="request-card">
                            <strong>${a.title}</strong> - ${a.description || ''}<br>${fileHtml}<br>
                            المعلن: ${a.advertiser_name || 'غير معروف'}<br>
                            كود الدفع: <span class="payment-code">${a.payment_code}</span><br>
                            المبلغ: ${a.ad_fee}$<br>
                            <span class="badge-pending">⏳ قيد المراجعة</span>
                            <div class="payment-section">
                                <button class="btn btn-sm btn-success" onclick="confirmPayment('${a._id}','${a.payment_code}')">💰 تأكيد الدفع ونشر الإعلان</button>
                            </div>
                            <div class="actions">
                                <button class="btn btn-sm btn-danger" onclick="rejectRequest('ad','${a._id}')">❌ رفض</button>
                            </div>
                        </div>`;
                    });
                }

                if (!data.products?.length && !data.jobs?.length && !data.services?.length && !data.applications?.length && !data.serviceRequests?.length && !data.ads?.length) {
                    html += '<div class="card"><p class="empty-message">✅ لا توجد طلبات معلقة حالياً</p></div>';
                }

                content.innerHTML = html;
            } catch(e) {
                console.error('خطأ في تحميل الطلبات:', e);
                content.innerHTML = `<div class="card"><p style="color:red;">❌ حدث خطأ أثناء تحميل الطلبات: ${e.message}</p></div>`;
            }
        }

        async function approveRequest(type, id) {
            if (!confirm('تأكيد الموافقة على هذا الطلب؟')) return;
            try {
                const res = await fetch(`/api/admin/approve/${type}/${id}`, { method: 'PUT' });
                const result = await res.json();
                alert(result.message || (result.error ? '❌ ' + result.error : 'تم'));
                if (res.ok) loadPendingRequests();
            } catch(e) { alert('فشل الموافقة'); }
        }

        async function rejectRequest(type, id) {
            if (!confirm('تأكيد رفض وحذف هذا الطلب؟')) return;
            try {
                const res = await fetch(`/api/admin/reject/${type}/${id}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message || (result.error ? '❌ ' + result.error : 'تم'));
                if (res.ok) loadPendingRequests();
            } catch(e) { alert('فشل الرفض'); }
        }

        async function confirmPayment(adId, paymentCode) {
            if (!confirm(`تأكيد دفع المبلغ وتفعيل الإعلان؟\nكود الدفع: ${paymentCode}`)) return;
            try {
                const res = await fetch(`/api/admin/confirm-payment/${adId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payment_code: paymentCode })
                });
                const result = await res.json();
                alert(result.message || (result.error ? '❌ ' + result.error : 'تم'));
                if (res.ok) loadPendingRequests();
            } catch(e) { alert('فشل تأكيد الدفع'); }
        }

        function logout() {
            if (confirm('تسجيل الخروج؟')) {
                fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/');
            }
        }

        document.querySelectorAll('.sidebar-menu .menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar-menu .menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                const section = this.dataset.section;
                document.getElementById('marketContent').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';

                if (section === 'pending') loadPendingRequests();
                else if (section === 'confirm-payment') {
                    document.getElementById('sectionContent').innerHTML = `
                        <h2>💰 تأكيد الدفع للإعلانات الممولة</h2>
                        <div class="card">
                            <p>اذهب إلى قسم <strong>"الطلبات المعلقة"</strong> وابحث عن الإعلانات الممولة.</p>
                            <p>بجوار كل إعلان ستجد <strong>كود الدفع</strong> والمبلغ، اضغط على <strong>"تأكيد الدفع ونشر الإعلان"</strong> بعد التحقق من استلام المبلغ.</p>
                            <p style="color:#27ae60;font-weight:bold;">📌 ملاحظة: يجب التحقق من استلام المبلغ قبل تأكيد الدفع.</p>
                        </div>
                    `;
                }
            });
        });

        document.getElementById('dashboardContent').style.display = 'none';
        loadMarketData('products');

        loadUser();
    </script>
</body>
</html>
