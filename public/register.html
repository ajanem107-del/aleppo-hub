<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Aleppo Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🏭</span>
                <span class="logo-text">Aleppo <span class="gold">Hub</span></span>
            </div>
            <div class="nav-links">
                <a href="/login.html">تسجيل الدخول</a>
                <a href="/register.html" class="active">إنشاء حساب</a>
            </div>
            <div class="nav-auth">
                <a href="/login.html" class="btn-outline-nav">تسجيل الدخول</a>
            </div>
        </div>
    </nav>

    <section class="auth-page">
        <div class="auth-card">
            <h2>📝 إنشاء حساب جديد</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>👤 الاسم</label>
                    <input type="text" id="regName" required>
                </div>
                <div class="form-group">
                    <label>📧 البريد الإلكتروني</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>🔑 كلمة المرور</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>📞 رقم الهاتف</label>
                    <input type="text" id="regPhone">
                </div>
                <div class="form-group">
                    <label>🎯 الدور</label>
                    <select id="regRole">
                        <option value="worker">👷 عامل</option>
                        <option value="industrial">🏭 صناعي</option>
                        <option value="provider">📢 مقدم خدمة</option>
                    </select>
                </div>
                <div class="form-group" id="companyField">
                    <label>🏢 اسم الشركة (للصناعي)</label>
                    <input type="text" id="regCompany">
                </div>
                <button type="submit">إنشاء حساب</button>
                <p style="margin-top:15px; text-align:center;">
                    لديك حساب؟ <a href="/login.html" style="color:#c9a03d; font-weight:600;">تسجيل الدخول</a>
                </p>
                <div id="registerMessage"></div>
            </form>
        </div>
    </section>

    <script>
        document.getElementById('regRole').addEventListener('change', function() {
            document.getElementById('companyField').style.display = this.value === 'industrial' ? 'block' : 'none';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                phone: document.getElementById('regPhone').value,
                role: document.getElementById('regRole').value,
                company_name: document.getElementById('regCompany').value
            };
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    document.getElementById('registerMessage').innerHTML = `<div class="alert alert-success">✅ ${result.message}. يمكنك الآن تسجيل الدخول.</div>`;
                    setTimeout(() => window.location.href = '/login.html', 2000);
                } else {
                    document.getElementById('registerMessage').innerHTML = `<div class="alert alert-error">❌ ${result.error}</div>`;
                }
            } catch(err) {
                document.getElementById('registerMessage').innerHTML = `<div class="alert alert-error">❌ خطأ في الاتصال</div>`;
            }
        });
    </script>
</body>
</html>
