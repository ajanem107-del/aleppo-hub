<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المعلن - Aleppo Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><span class="logo-icon">📢</span><span class="logo-text">Aleppo <span class="gold">Hub</span></span></div>
            <div class="nav-links"><a href="/">الرئيسية</a><a href="#" onclick="logout()" style="color:#c0392b;">تسجيل الخروج</a></div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar-modern">
            <div class="user-profile">
                <div class="avatar">📢</div>
                <h3 id="userName">معلن</h3>
                <p id="userEmail">provider@example.com</p>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" data-section="services">🛠️ خدماتي</a>
                <a href="#" class="menu-item" data-section="requests">📩 طلبات الخدمات</a>
                <a href="#" class="menu-item" data-section="add-service">➕ إضافة خدمة</a>
                <a href="#" class="menu-item" data-section="paid-ads">💰 الإعلانات الممولة</a>
            </nav>
        </aside>

        <main class="content-modern">
            <div id="dashboardContent">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><span id="statServices">0</span><small>خدماتي</small></div>
                    <div class="stat-card"><span id="statRequests">0</span><small>طلبات واردة</small></div>
                    <div class="stat-card"><span id="statPaidAds">0</span><small>إعلانات ممولة</small></div>
                </div>
                <div id="sectionContent"></div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('userName').textContent = 'خالد المعلن';
        document.getElementById('userEmail').textContent = 'khaled@provider.com';

        async function loadProviderData() {
            try {
                const res = await fetch('/api/my-services');
                const services = await res.json();
                document.getElementById('statServices').textContent = services.length || 0;
            } catch(e) { console.error(e); }
            try {
                const res = await fetch('/api/service-requests/received');
                const requests = await res.json();
                document.getElementById('statRequests').textContent = requests.length || 0;
            } catch(e) { console.error(e); }
            try {
                const res = await fetch('/api/admin/external-ads');
                const ads = await res.json();
                document.getElementById('statPaidAds').textContent = ads.length || 0;
            } catch(e) { console.error(e); }
        }

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                const section = this.dataset.section;
                const content = document.getElementById('sectionContent');
                if (section === 'services') {
                    content.innerHTML = '<h2>🛠️ خدماتي</h2><div class="card"><p>جاري التحميل...</p></div>';
                } else if (section === 'requests') {
                    content.innerHTML = '<h2>📩 طلبات الخدمات</h2><div class="card"><p>جاري التحميل...</p></div>';
                } else if (section === 'add-service') {
                    content.innerHTML = `
                        <h2>➕ إضافة خدمة جديدة</h2>
                        <div class="card">
                            <form id="serviceForm" enctype="multipart/form-data">
                                <div class="form-group"><label>عنوان الخدمة</label><input type="text" id="servTitle" required></div>
                                <div class="form-group"><label>التصنيف</label>
                                    <select id="servCategory" required>
                                        <option value="">-- اختر --</option>
                                        <option>مقاولات</option><option>صيانة</option><option>نقل</option>
                                        <option>استشارات قانونية</option><option>محاسبة</option>
                                        <option>تقنية معلومات</option><option>خدمات عامة</option>
                                    </select>
                                </div>
                                <div class="form-group"><label>الوصف</label><textarea id="servDesc" rows="2" required></textarea></div>
                                <div class="form-group"><label>نطاق السعر</label><input type="text" id="servPrice" placeholder="500-1000$ أو حسب الاتفاق"></div>
                                <div class="form-group"><label>رقم التواصل</label><input type="text" id="servPhone"></div>
                                <div class="form-group"><label>رفع ملف (صورة أو فيديو)</label><input type="file" id="servFile" accept="image/*,video/*"></div>
                                <button type="submit">نشر الخدمة</button>
                            </form>
                        </div>
                    `;
                    document.getElementById('serviceForm').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData();
                        formData.append('title', document.getElementById('servTitle').value);
                        formData.append('category', document.getElementById('servCategory').value);
                        formData.append('description', document.getElementById('servDesc').value);
                        formData.append('price_range', document.getElementById('servPrice').value);
                        formData.append('contact_phone', document.getElementById('servPhone').value);
                        const file = document.getElementById('servFile').files[0];
                        if (file) formData.append('file', file);
                        try {
                            const res = await fetch('/api/services', { method: 'POST', body: formData });
                            const result = await res.json();
                            alert(result.message || (result.error ? '❌ ' + result.error : 'تم النشر'));
                            if (res.ok) { document.getElementById('serviceForm').reset(); loadProviderData(); }
                        } catch(e) { alert('فشل النشر'); }
                    });
                } else if (section === 'paid-ads') {
                    content.innerHTML = `
                        <h2>💰 الإعلانات الممولة</h2>
                        <div class="card">
                            <h3>إعلاناتي الممولة</h3>
                            <div id="myPaidAds"><p>📭 لا توجد إعلانات حالياً</p></div>
                        </div>
                    `;
                    async function loadPaidAds() {
                        try {
                            const res = await fetch('/api/admin/external-ads');
                            const data = await res.json();
                            const div = document.getElementById('myPaidAds');
                            if (!data || data.length === 0) {
                                div.innerHTML = '<p>📭 لا توجد إعلانات ممولة حالياً</p>';
                                return;
                            }
                            let html = '';
                            data.forEach(ad => {
                                const fileHtml = ad.file_url ? 
                                    (ad.file_type === 'video' ? 
                                        `<video controls style="max-width:200px;max-height:150px;border-radius:8px;margin:5px 0;"><source src="${ad.file_url}"></video>` :
                                        `<img src="${ad.file_url}" style="max-width:200px;max-height:150px;border-radius:8px;margin:5px 0;">`) : '';
                                html += `<div class="item-card">
                                    <strong>${ad.title}</strong> - ${ad.description || ''}<br>
                                    ${fileHtml}<br>
                                    المعلن: ${ad.advertiser_name} (${ad.advertiser_phone || ''})<br>
                                    كود الدفع: <strong style="color:#27ae60;">${ad.payment_code || 'غير متوفر'}</strong><br>
                                    الحالة: ${ad.is_active ? '✅ نشط' : '⛔ غير نشط'} | دفع: ${ad.payment_status === 'confirmed' ? '✅ مؤكد' : '⏳ قيد الانتظار'}<br>
                                    ${ad.payment_status === 'confirmed' ? '' : '⏳ في انتظار تأكيد الدفع من الإدارة'}
                                </div>`;
                            });
                            div.innerHTML = html;
                        } catch(e) { console.error(e); }
                    }
                    loadPaidAds();
                }
            });
        });

        function logout() {
            if (confirm('تسجيل الخروج؟')) {
                fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/');
            }
        }

        loadProviderData();
        document.querySelector('.menu-item[data-section="services"]').click();
    </script>
</body>
</html>
