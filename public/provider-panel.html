<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المعلن - Aleppo Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo"><span class="logo-icon">🏭</span><span class="logo-text">Aleppo <span class="gold">Hub</span></span></div>
            <div class="nav-links"><a href="/">الرئيسية</a><a href="#" onclick="logout()" style="color:#c0392b;">تسجيل الخروج</a></div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar-modern">
            <div class="user-profile">
                <div class="avatar">📢</div>
                <h3 id="userName">معلن</h3>
                <p id="userEmail">provider@example.com</p>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" data-section="services">🛠️ خدماتي</a>
                <a href="#" class="menu-item" data-section="requests">📩 طلبات الخدمات</a>
                <a href="#" class="menu-item" data-section="add-service">➕ إضافة خدمة</a>
                <a href="#" class="menu-item" data-section="paid-ads">💰 الإعلانات الممولة</a>
            </nav>
        </aside>

        <main class="content-modern">
            <div id="dashboardContent">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><span id="statServices">0</span><small>خدماتي</small></div>
                    <div class="stat-card"><span id="statRequests">0</span><small>طلبات واردة</small></div>
                    <div class="stat-card"><span id="statPaidAds">0</span><small>إعلانات ممولة</small></div>
                </div>
                <div id="sectionContent"></div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('userName').textContent = 'خالد المعلن';
        document.getElementById('userEmail').textContent = 'khaled@provider.com';

        // تحميل البيانات
        async function loadProviderData() {
            try {
                const res = await fetch('/api/my-services');
                const services = await res.json();
                document.getElementById('statServices').textContent = services.length || 0;
            } catch(e) { console.error(e); }
            try {
                const res = await fetch('/api/service-requests/received');
                const requests = await res.json();
                document.getElementById('statRequests').textContent = requests.length || 0;
            } catch(e) { console.error(e); }
            try {
                const res = await fetch('/api/admin/external-ads');
                const ads = await res.json();
                document.getElementById('statPaidAds').textContent = ads.length || 0;
            } catch(e) { console.error(e); }
        }

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                const section = this.dataset.section;
                const content = document.getElementById('sectionContent');
                if (section === 'services') {
                    content.innerHTML = '<h2>🛠️ خدماتي</h2><div class="card"><p>جاري التحميل...</p></div>';
                } else if (section === 'requests') {
                    content.innerHTML = '<h2>📩 طلبات الخدمات</h2><div class="card"><p>جاري التحميل...</p></div>';
                } else if (section === 'add-service') {
                    content.innerHTML = `
                        <h2>➕ إضافة خدمة جديدة</h2>
                        <div class="card">
                            <form id="serviceForm">
                                <div class="form-group"><label>عنوان الخدمة</label><input type="text" id="servTitle" required></div>
                                <div class="form-group"><label>التصنيف</label>
                                    <select id="servCategory" required>
                                        <option value="">-- اختر --</option>
                                        <option>مقاولات</option><option>صيانة</option><option>نقل</option>
                                        <option>استشارات قانونية</option><option>محاسبة</option>
                                        <option>تقنية معلومات</option><option>خدمات عامة</option>
                                    </select>
                                </div>
                                <div class="form-group"><label>الوصف</label><textarea id="servDesc" rows="2" required></textarea></div>
                                <div class="form-group"><label>نطاق السعر</label><input type="text" id="servPrice" placeholder="500-1000$ أو حسب الاتفاق"></div>
                                <div class="form-group"><label>رقم التواصل</label><input type="text" id="servPhone"></div>
                                <div class="form-group"><label>رابط الصورة</label><input type="text" id="servImage"></div>
                                <button type="submit">نشر الخدمة</button>
                            </form>
                        </div>
                    `;
                    document.getElementById('serviceForm').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const data = {
                            title: document.getElementById('servTitle').value,
                            category: document.getElementById('servCategory').value,
                            description: document.getElementById('servDesc').value,
                            price_range: document.getElementById('servPrice').value,
                            contact_phone: document.getElementById('servPhone').value,
                            image_url: document.getElementById('servImage').value
                        };
                        try {
                            const res = await fetch('/api/services', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(data)
                            });
                            const result = await res.json();
                            alert(result.message || (result.error ? '❌ ' + result.error : 'تم النشر'));
                            if (res.ok) {
                                document.getElementById('serviceForm').reset();
                                loadProviderData();
                            }
                        } catch(e) { alert('فشل النشر'); }
                    });
                } else if (section === 'paid-ads') {
                    content.innerHTML = `
                        <h2>💰 بوابة الإعلانات الممولة</h2>
                        <div class="card">
                            <h3>➕ إضافة إعلان ممول جديد</h3>
                            <form id="paidAdForm" enctype="multipart/form-data">
                                <div class="form-group"><label>عنوان الإعلان</label><input type="text" id="adTitle" required></div>
                                <div class="form-group"><label>الوصف</label><textarea id="adDesc" rows="2"></textarea></div>
                                <div class="form-group"><label>صورة الإعلان</label><input type="file" id="adImage" accept="image/*" required></div>
                                <div class="form-group"><label>رابط الإعلان (اختياري)</label><input type="text" id="adLink" placeholder="https://..."></div>
                                <div class="form-group"><label>اسم المعلن</label><input type="text" id="advertiserName" required></div>
                                <div class="form-group"><label>رقم الهاتف</label><input type="text" id="advertiserPhone"></div>
                                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="advertiserEmail"></div>
                                <button type="submit">💰 نشر الإعلان الممول</button>
                            </form>
                            <hr>
                            <h3>📋 إعلاناتي الممولة</h3>
                            <div id="myPaidAds"><p>📭 لا توجد إعلانات حالياً</p></div>
                        </div>
                    `;

                    // معالج نموذج الإعلانات الممولة
                    document.getElementById('paidAdForm').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const formData = new FormData();
                        formData.append('title', document.getElementById('adTitle').value);
                        formData.append('description', document.getElementById('adDesc').value);
                        formData.append('link_url', document.getElementById('adLink').value);
                        formData.append('advertiser_name', document.getElementById('advertiserName').value);
                        formData.append('advertiser_phone', document.getElementById('advertiserPhone').value);
                        formData.append('advertiser_email', document.getElementById('advertiserEmail').value);
                        const imageFile = document.getElementById('adImage').files[0];
                        if (imageFile) formData.append('image', imageFile);
                        try {
                            const res = await fetch('/api/admin/external-ad', {
                                method: 'POST',
                                body: formData
                            });
                            const result = await res.json();
                            alert(result.message || (result.error ? '❌ ' + result.error : 'تم النشر'));
                            if (res.ok) {
                                document.getElementById('paidAdForm').reset();
                                loadPaidAds();
                                loadProviderData();
                            }
                        } catch(e) { alert('فشل النشر'); }
                    });

                    // جلب الإعلانات الممولة
                    async function loadPaidAds() {
                        try {
                            const res = await fetch('/api/admin/external-ads');
                            const data = await res.json();
                            const div = document.getElementById('myPaidAds');
                            if (!data || data.length === 0) {
                                div.innerHTML = '<p>📭 لا توجد إعلانات ممولة حالياً</p>';
                                return;
                            }
                            let html = '';
                            data.forEach(ad => {
                                const imgHtml = ad.image_url ? `<img src="${ad.image_url}" style="max-width:100px;max-height:80px;border-radius:8px;margin:5px 0;">` : '';
                                html += `<div class="item-card">
                                    <strong>${ad.title}</strong> - ${ad.description || ''}<br>
                                    ${imgHtml}<br>
                                    المعلن: ${ad.advertiser_name} (${ad.advertiser_phone || ''})<br>
                                    الحالة: ${ad.is_active ? '✅ نشط' : '⛔ غير نشط'} | دفع: ${ad.is_paid ? '✅ مدفوع' : '❌ غير مدفوع'}<br>
                                    الرسوم: ${ad.ad_fee}$<br>
                                    ${!ad.is_paid ? `<button class="btn btn-sm btn-success" onclick="payAd('${ad._id}')">💰 دفع وتفعيل</button>` : ''}
                                    <button class="btn btn-sm btn-danger" onclick="deleteAd('${ad._id}')">🗑️ حذف</button>
                                </div>`;
                            });
                            div.innerHTML = html;
                        } catch(e) { console.error(e); }
                    }

                    window.payAd = async (adId) => {
                        if (!confirm('تأكيد دفع رسوم الإعلان وتفعيله؟')) return;
                        try {
                            const res = await fetch('/api/pay-external-ad', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ad_id: adId })
                            });
                            const result = await res.json();
                            alert(result.message || (result.error ? '❌ ' + result.error : 'تم'));
                            if (res.ok) { loadPaidAds(); loadProviderData(); }
                        } catch(e) { alert('فشل الدفع'); }
                    };

                    window.deleteAd = async (adId) => {
                        if (!confirm('حذف هذا الإعلان؟')) return;
                        try {
                            await fetch(`/api/admin/external-ad/${adId}`, { method: 'DELETE' });
                            loadPaidAds();
                            loadProviderData();
                        } catch(e) { alert('فشل الحذف'); }
                    };

                    loadPaidAds();
                }
            });
        });

        function logout() {
            if (confirm('تسجيل الخروج؟')) {
                fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/');
            }
        }

        loadProviderData();
        document.querySelector('.menu-item[data-section="services"]').click();
    </script>
</body>
</html>
